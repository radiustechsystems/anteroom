name: ci
# `workflow_call` is how release.yaml stops depending on someone remembering to
# check: it calls this workflow and refuses to publish unless it passes.
# Everything below is the definition of "verified" for both paths, which is the
# only reason it is worth calling rather than copying.
on:
  # A commit on a PR branch is both a `push` and a `pull_request` synchronize
  # event, so an unscoped `push` runs every job twice for the same tree. Scoping
  # `push` to the default branch leaves exactly one run per commit: branch
  # commits are covered by `pull_request`, and post-merge commits on `main` by
  # `push`. Tag pushes are deliberately absent — release.yaml calls this
  # workflow, so adding tags here would duplicate that too.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

# Superseded runs are wasted capacity, not extra coverage: a new commit on a
# branch invalidates the in-flight run for the previous one. `main` and the
# release path are excluded from cancellation so every merged commit and every
# gated publish keeps a completed result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track upstream stable rather than the module's floor. Pinning a
          # patch release here is how CI ends up building on a toolchain with
          # known advisories months after they were fixed.
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: vet (acceptance)
        # The acceptance suite is behind a build tag, so `go vet ./...` never
        # compiles it. Without this a broken harness would sit green until
        # someone ran the suite by hand.
        run: go vet -tags e2e ./acceptance/...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: govulncheck
        # Catches the case this job exists to prevent: shipping on a toolchain
        # or dependency with a known, reachable advisory.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  go122:
    # go.mod intentionally keeps the build floor at Go 1.22 for distributions
    # that do not package a newer toolchain. Release artifacts still use current
    # Go so they contain current standard-library security fixes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
      - name: test minimum supported Go
        run: go test ./...

  dist:
    # The release cross-compiles a binary for every platform in the Makefile's
    # DIST_PLATFORMS and attaches the archives to the Release. That build only
    # ever runs on a tag push, which is the worst possible moment to discover
    # that a new import does not compile for windows or that an archive came out
    # empty: the tag is already in the world. So build them here too.
    #
    # It is a compile, not a test — nothing here can run a darwin/arm64 binary —
    # but "does it build for every platform we promise" is exactly the claim the
    # release makes and the one that breaks silently.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: cross-compile the release archives
        # The target asserts it produced one archive per platform, so this step
        # fails on a platform that silently built nothing as well as on one that
        # failed to compile.
        run: make dist

  acceptance:
    # Tiers 0 and 1 exercise the image and the deployed gate.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: docker/setup-buildx-action@v3
      - name: acceptance (tiers 0-1)
        run: go test -tags e2e -count=1 -timeout 6m ./acceptance/...
      - name: leave no containers behind
        if: always()
        run: docker ps -a --filter 'name=artest-' -q | xargs -r docker rm -f

  browser:
    # Real engines cover the service-worker, renewal, and JavaScript fallback
    # behavior that unit and container-only tests cannot execute.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: acceptance/tier2_browser/package-lock.json
      - name: install test dependencies
        working-directory: acceptance/tier2_browser
        run: npm ci
      - name: install browser engines
        working-directory: acceptance/tier2_browser
        run: npx playwright install --with-deps chromium firefox
      - name: acceptance (browser tier)
        working-directory: acceptance/tier2_browser
        run: npm test
      - name: leave no containers behind
        if: always()
        run: docker ps -a --filter 'name=artier2-' -q | xargs -r docker rm -f
