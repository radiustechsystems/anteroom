{{- /*
Give every opted-in namespace the two resources the sidecar mounts:

  1. The ConfigMap holding the gate's policy file (.Values.gateConfig),
     written as data so this chart is the single place the fleet's gate
     policy lives; synchronize: true rolls edits out to every namespace and
     reverts hand-edits to the generated copies.
  2. The HMAC signing-key Secret, CLONED from a source namespace. Cloned
     rather than generated because a key must be minted once, by you
     (`openssl rand -base64 32`), and never written into a chart or a values
     file: a committed key is a published key.

Kyverno's background controller needs RBAC to manage what it generates —
templates/rbac.yaml, on by default — or the policy is refused at apply time
by Kyverno's policy-validation webhook, which names the missing permission.
*/ -}}
{{- if or .Values.policies.generateConfig .Values.hmacSecret.clone .Values.admin.networkPolicy.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-anteroom-config
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Anteroom config and key
    policies.kyverno.io/category: Anteroom
    policies.kyverno.io/subject: ConfigMap, Secret
    policies.kyverno.io/description: >-
      Creates the anteroom-config ConfigMap and clones the anteroom HMAC
      Secret into every namespace labeled anteroom.radiustech.xyz/inject=enabled.
spec:
  rules:
    {{- if .Values.policies.generateConfig }}
    - name: generate-config
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      generate:
        # Namespaces labeled before this policy existed get the resources
        # too, not only ones admitted after it.
        generateExisting: true
        apiVersion: v1
        kind: ConfigMap
        name: {{ .Values.configMapName }}
        namespace: {{ `"{{ request.object.metadata.name }}"` }}
        # Also the opt-out path: removing the namespace label makes the trigger
        # stop matching, and a synchronized downstream is deleted when that
        # happens. Nothing is left behind to clean up by hand.
        synchronize: true
        {{- if .Values.orphanDownstreamOnPolicyDelete }}
        # Non-default: keeps this ConfigMap in every namespace when the policy
        # or the chart is deleted, which Kyverno otherwise takes as the signal
        # to remove what it generated from data.
        orphanDownstreamOnPolicyDelete: true
        {{- end }}
        data:
          data:
            anteroom.toml: |
              {{- .Values.gateConfig | nindent 14 }}
    {{- end }}
    {{- if .Values.hmacSecret.clone }}
    - name: clone-hmac-secret
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      generate:
        generateExisting: true
        apiVersion: v1
        kind: Secret
        name: {{ .Values.secretName }}
        namespace: {{ `"{{ request.object.metadata.name }}"` }}
        # Rotation is an edit to the source Secret; the clones follow. Pods
        # pick the new key up only on restart — env vars are read once — so
        # rotate with a rollout, and expect in-flight passes signed by the
        # old key to die: single-key rotation is a hard cutover.
        # Zero-downtime rotation needs [[hmac_keys]] in gateConfig (first key
        # signs, the rest still verify), which is file-keyed and therefore a
        # different fleet-wide mechanism than the env var — never mix the two
        # in one fleet.
        #
        # synchronize also deletes this clone when the namespace label is
        # removed. It does NOT delete it when the policy or the chart is
        # deleted: Kyverno retains cloned downstreams and removes generated-
        # from-data ones, so `helm uninstall` takes the ConfigMap and leaves
        # the key. Deliberate on Kyverno's part — deleting copies of a secret
        # is not a thing to do as a side effect — and the reason
        # orphanDownstreamOnPolicyDelete appears on the data rules above and
        # not here, where it would have nothing to change.
        synchronize: true
        clone:
          namespace: {{ .Values.hmacSecret.sourceNamespace }}
          name: {{ .Values.hmacSecret.sourceName }}
    {{- end }}
    {{- if .Values.admin.networkPolicy.enabled }}
    # Fence the exposed admin port. This rule exists only because
    # admin.expose moves an unauthenticated listener onto the pod network;
    # without it, every pod in the cluster can read traffic volumes and
    # visitor IPs off every gate.
    #
    # A NetworkPolicy is deny-by-default for the pods it selects, so this
    # rule decides ALL ingress to gated pods, not just the admin port. The
    # gate's own 8080 is admitted from anywhere — that is the site. The
    # application's port is not, which closes the side door on purpose
    # (examples/kyverno/README.md, "The side door"); admit it back through
    # admin.networkPolicy.extraIngress if something legitimately dials the
    # app directly. Kubelet probes reach the app container from inside the
    # node and are exempt on some CNIs and blocked by others — verify on
    # yours, because a blocked probe kills healthy pods.
    - name: generate-admin-networkpolicy
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      generate:
        generateExisting: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: anteroom-admin
        namespace: {{ `"{{ request.object.metadata.name }}"` }}
        # And the opt-out path: removing the namespace label makes the trigger
        # stop matching, which deletes the fence along with the ConfigMap. A
        # namespace that stops being gated does not keep a policy fencing it.
        synchronize: true
        {{- if .Values.orphanDownstreamOnPolicyDelete }}
        orphanDownstreamOnPolicyDelete: true
        {{- end }}
        data:
          spec:
            podSelector:
              matchLabels:
                anteroom.radiustech.xyz/inject: enabled
            policyTypes: [Ingress]
            ingress:
              # The site. Numeric because NetworkPolicy resolves port names
              # against the pod's containers only on clusters with the
              # feature enabled, and 8080 is what the injection policy always
              # sets.
              - ports:
                  - port: {{ include "kyverno-policies.gatePort" . | int }}
                    protocol: TCP
              # The operator listener, collector only.
              - ports:
                  - port: {{ .Values.admin.port }}
                    protocol: TCP
                from:
                  - podSelector:
                      matchLabels:
                        {{- toYaml .Values.admin.networkPolicy.collectorSelector | nindent 24 }}
                    {{- with .Values.admin.networkPolicy.collectorNamespaceSelector }}
                    namespaceSelector:
                      matchLabels:
                        {{- toYaml . | nindent 24 }}
                    {{- end }}
              {{- with .Values.admin.networkPolicy.extraIngress }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
    {{- end }}
{{- end }}
