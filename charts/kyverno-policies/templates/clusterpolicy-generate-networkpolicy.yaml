{{- /*
Close the side door: fence gated pods so the only port anything on the
cluster network can reach is the gate's.

Rewriting the Service moves SERVICE traffic behind the gate. It does nothing
about the pod IP, which keeps answering on the application's own port to
anything that can route to it — the Kubernetes equivalent of the Compose app
that still publishes its own port. This policy is the fence: one
namespace-scoped NetworkPolicy selecting the same pods the injection policy
selects, admitting the gate's port and nothing else.

Off by default, and that is a considered position rather than timidity. A
NetworkPolicy is the one resource in this chart whose failure mode is not
visible in the object it creates:

  - On a CNI that does not implement NetworkPolicy (kind's default kindnetd,
    among others) the object applies cleanly and enforces nothing. It looks
    installed and fences nothing.
  - On a CNI that enforces it, whether the kubelet's probe traffic is exempt
    is a per-plugin, per-configuration answer. The application container's
    probes target the application's port — precisely the port this fences —
    so where probes are NOT exempt, this policy fails closed by killing
    healthy pods. `networkPolicy.extraIngress` is the escape hatch, and the
    chart README works the node-CIDR case.

So: opt in per cluster, having checked what your CNI does, which is a
question the chart cannot answer for you.

Ingress-only on purpose. `policyTypes` names Ingress alone so egress stays
untouched — a generated policy that also selected Egress would take DNS out
from under every gated pod, and the x402 door's outbound RPC with it.
*/ -}}
{{- if .Values.policies.networkPolicy }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-anteroom-networkpolicy
  labels:
    {{- include "kyverno-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Fence gated pods behind Anteroom
    policies.kyverno.io/category: Anteroom
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: >-
      Generates a NetworkPolicy into every namespace labeled
      anteroom.radiustech.xyz/inject=enabled that admits only the gate's port
      to pods carrying the same label, so nothing on the cluster network can
      reach the application container directly on the pod IP.
spec:
  rules:
    - name: generate-networkpolicy
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      generate:
        # Namespaces labeled before this policy existed get the fence too.
        generateExisting: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: {{ .Values.networkPolicy.name }}
        namespace: {{ `"{{ request.object.metadata.name }}"` }}
        # Reverts hand-edits to the generated copy, rolls chart edits out to
        # every namespace, and — the half that matters for opting back out —
        # deletes the fence when the namespace label is removed.
        synchronize: true
        {{- if .Values.orphanDownstreamOnPolicyDelete }}
        orphanDownstreamOnPolicyDelete: true
        {{- end }}
        data:
          metadata:
            labels:
              {{- include "kyverno-policies.labels" . | nindent 14 }}
          spec:
            # The same selector the injection policy matches on, so the fence
            # covers exactly the pods that carry a gate. An unlabeled workload
            # sharing the namespace is untouched — this is not a namespace
            # default-deny, and it is not trying to be one.
            podSelector:
              matchLabels:
                anteroom.radiustech.xyz/inject: enabled
            # Ingress alone. Naming Egress here would deny all egress from
            # gated pods the moment this lands, DNS included.
            policyTypes:
              - Ingress
            ingress:
              # No `from`: the gate's port is open to everything that can
              # route to the pod. It has to be — an ingress controller lives
              # in another namespace, and NodePort and LoadBalancer traffic
              # arrives from off-cluster. The gate is the access control on
              # this port; that is its whole job.
              #
              # Everything the rule does not name is denied, and that denial
              # is the point: selecting a pod with an ingress rule denies all
              # other inbound traffic to it, so the application's port stops
              # answering on the pod IP without ever being mentioned here.
              - ports:
                  - port: {{ include "kyverno-policies.gatePort" . | int }}
                    protocol: TCP
              {{- with .Values.networkPolicy.extraIngress }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
{{- end }}
