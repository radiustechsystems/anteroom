apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: anteroom-policies
    app.kubernetes.io/managed-by: kyverno
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/part-of: anteroom
    app.kubernetes.io/version: latest
  name: only-through-anteroom
  namespace: hello
spec:
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      anteroom.radiustech.xyz/inject: enabled
  policyTypes:
  - Ingress
