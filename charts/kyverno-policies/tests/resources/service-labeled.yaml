# The demo Service as an author of an ungated app would write it, plus the one
# label that asks for the rewrite.
apiVersion: v1
kind: Service
metadata:
  name: hello-app
  namespace: hello
  labels:
    anteroom.radiustech.xyz/proxied: enabled
spec:
  selector:
    app: hello-app
  ports:
    - name: http
      port: 80
      targetPort: http
