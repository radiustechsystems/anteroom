# Inject the gate into any pod that asks for it.
#
# Opt-in is two pieces of pod-template metadata, both required:
#
#   labels:
#     anteroom.radiustech.xyz/inject: enabled
#   annotations:
#     anteroom.radiustech.xyz/upstream-port: "3000"   # the app's containerPort
#
# The label selects the pod for injection; the annotation tells the gate where
# the application listens. The first rule below makes a missing annotation an
# admission ERROR rather than a guessed default, for the same reason the binary
# treats an unknown config key as a startup error: a gate proxying to the wrong
# port fails as "the site is down", which is a worse place to find the typo.
#
# The gate is injected as an ordinary long-running container beside the app,
# which works on any Kubernetes version. Startup ordering is handled by the
# readiness probe rather than by the kubelet: until the gate answers
# /.anteroom/healthz the pod is not Ready and the Service sends it nothing, so
# there is no window where traffic routes to a pod whose gate is absent. On
# Kubernetes 1.29+ the same spec can instead be placed under initContainers
# with restartPolicy: Always — the "native sidecar" pattern, which still runs
# for the pod's whole life as a proxy but adds guaranteed start-before-app and
# stop-after-app ordering; everything else here is unchanged either way.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-anteroom-sidecar
  annotations:
    policies.kyverno.io/title: Inject Anteroom sidecar
    policies.kyverno.io/category: Anteroom
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Injects an Anteroom proof-of-work gate as a sidecar proxy container
      into pods labeled anteroom.radiustech.xyz/inject=enabled, proxying to
      the port named by the anteroom.radiustech.xyz/upstream-port annotation.
    # Mutate the POD, not the workload that owns it. By default Kyverno
    # auto-generates counterpart rules that would rewrite the Deployment's own
    # template at admission — which works, but then every `kubectl diff`, Argo
    # sync, and Flux reconcile sees a resource that no longer matches its
    # manifest and tries to fight the policy. Pod-level mutation keeps the
    # committed manifests clean; the injected container is visible where it
    # runs (`kubectl get pod -o yaml`), which is also where you debug it.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    # Rule 1: a pod that opts in must say where its app listens.
    - name: require-upstream-port
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      validate:
        message: >-
          Pods labeled anteroom.radiustech.xyz/inject=enabled must carry the
          annotation anteroom.radiustech.xyz/upstream-port naming the port the
          application container listens on (e.g. "3000"). The gate will not
          guess: proxying to the wrong port fails as "the site is down".
        pattern:
          metadata:
            annotations:
              anteroom.radiustech.xyz/upstream-port: "?*"

    # Rule 2: the injection itself.
    - name: inject-gate
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      preconditions:
        all:
          # Admission runs mutation before validation, so without this guard a
          # pod missing the annotation would die inside this rule with a
          # variable-substitution error instead of reaching rule 1's message.
          # Skipping here lets validation deny it legibly.
          - key: "{{ request.object.metadata.annotations.\"anteroom.radiustech.xyz/upstream-port\" || '' }}"
            operator: NotEquals
            value: ""
          # Idempotence: a pod that already carries the gate (hand-written, or
          # admitted before a policy change) is left alone rather than given a
          # second one that would fight the first for :8080.
          - key: "{{ request.object.spec.containers[?name=='anteroom'] || `[]` | length(@) }}"
            operator: Equals
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - name: anteroom
                # :latest is right for trying this and wrong in front of a real
                # site — with imagePullPolicy: Always a pod reschedule can
                # change the gate. Pin a digest or a minor version in
                # production; docs/docker.md#which-tag is the policy.
                image: ghcr.io/radiustechsystems/anteroom:latest
                # IfNotPresent, not the Always that a :latest tag defaults to.
                # Always makes every pod start a registry round-trip and
                # ignores images loaded directly onto nodes (`kind load`,
                # air-gapped mirrors) — the demo script depends on this line.
                # With a pinned digest, the two policies behave identically.
                imagePullPolicy: IfNotPresent
                ports:
                  # The NAME is load-bearing: the companion Service policy
                  # rewrites every Service targetPort to "anteroom", and a
                  # named targetPort resolves to whatever containerPort carries
                  # the name — so the Service needs no knowledge of the number.
                  - name: anteroom
                    containerPort: 8080
                env:
                  # 127.0.0.1, not a service name: containers in a pod share a
                  # network namespace. This is the line that differs from the
                  # Compose sidecar and the single most common copy-paste error
                  # between the two (docs/docker.md).
                  - name: ANTEROOM_UPSTREAM
                    value: "127.0.0.1:{{ request.object.metadata.annotations.\"anteroom.radiustech.xyz/upstream-port\" }}"
                  # The signing key. Passes are stateless signed cookies, so
                  # this is the only shared state the fleet needs — and every
                  # replica MUST get the same key or each gate walls the
                  # others' visitors. The Secret is cloned into the namespace
                  # by generate-anteroom-config.yaml.
                  - name: ANTEROOM_HMAC_KEY
                    valueFrom:
                      secretKeyRef:
                        name: anteroom
                        key: hmac-key
                volumeMounts:
                  # Replaces the image's default config wholesale. The
                  # ConfigMap is generated per-namespace by
                  # generate-anteroom-config.yaml; edits there are synced into
                  # the pod by the kubelet within about a minute, though the
                  # gate reads anteroom.toml only at startup — a policy change
                  # needs a rollout, only wait-page edits are live.
                  - name: anteroom-config
                    mountPath: /etc/anteroom
                    readOnly: true
                livenessProbe:
                  httpGet:
                    path: /.anteroom/healthz
                    port: anteroom
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /.anteroom/healthz
                    port: anteroom
                  periodSeconds: 5
                resources:
                  # One binary proxying one app: modest on purpose. The limit
                  # is memory only — a CPU limit would throttle the proxy path
                  # under the exact load the gate exists to absorb.
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 128Mi
                # The image is distroless, non-root, and needs nothing; say so
                # where the admission controller can hold it to that.
                securityContext:
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                  seccompProfile:
                    type: RuntimeDefault
            volumes:
              - name: anteroom-config
                configMap:
                  name: anteroom-config
