# Give every opted-in namespace the two resources the sidecar mounts.
#
# Labeling a namespace
#
#   anteroom.radiustech.xyz/inject: enabled
#
# generates, in that namespace:
#
#   1. ConfigMap anteroom-config — the gate's policy file, mounted over
#      /etc/anteroom by the injection policy. Written here as data (not a
#      clone) so this file is the single place the fleet's gate policy lives;
#      with synchronize: true, editing the TOML below rolls it out to every
#      namespace, and hand-edits to a generated copy are reverted.
#   2. Secret anteroom — the HMAC signing key, CLONED from the anteroom-system
#      namespace. Cloned rather than generated because a key must be minted
#      once, by you (`openssl rand -base64 32`), and never written into a
#      policy file: a committed policy is published, and a key in one is a
#      published key.
#
# One key for the whole cluster is the simple default and what makes any two
# replicas of the same gate verify each other's passes. Its cost is that every
# namespace holds the same secret, so a compromise of one is a compromise of
# all. If namespaces are your isolation boundary, delete the clone rule and
# create a distinct Secret per namespace by hand; the injection policy only
# cares that a Secret named "anteroom" with key "hmac-key" exists.
#
# Kyverno's background controller needs RBAC to manage what it generates —
# apply rbac.yaml alongside this policy or generation fails with a permission
# error in the ClusterPolicy's status, not at apply time.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-anteroom-config
  annotations:
    policies.kyverno.io/title: Generate Anteroom config and key
    policies.kyverno.io/category: Anteroom
    policies.kyverno.io/subject: ConfigMap, Secret
    policies.kyverno.io/description: >-
      Creates the anteroom-config ConfigMap and clones the anteroom HMAC
      Secret into every namespace labeled anteroom.radiustech.xyz/inject=enabled.
spec:
  rules:
    - name: generate-config
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      # Namespaces labeled before this policy existed get the resources too,
      # not only ones admitted after it.
      generateExisting: true
      generate:
        apiVersion: v1
        kind: ConfigMap
        name: anteroom-config
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          data:
            # The subset of anteroom.example.toml a sidecar deployment sets.
            # Unknown keys are a startup error, not a silent default — check
            # spelling against anteroom.example.toml at the repository root.
            anteroom.toml: |
              # All interfaces: the Service must reach the gate across the pod
              # network. The shipped default of 127.0.0.1:8080 would accept
              # nothing but the sidecar's own namespace.
              listen = ":8080"

              # `upstream` is deliberately absent: it is 127.0.0.1:<port> and
              # the port differs per workload, so the injection policy supplies
              # it as ANTEROOM_UPSTREAM from the pod's upstream-port
              # annotation. Environment variables override this file.

              pass_ttl    = "60s"   # a pass is short-lived on purpose; the service
              max_session = "30m"   # worker renews it in the background up to this cap
              difficulty  = 14      # ~16k WebCrypto hashes: about a second on a laptop
              renew_difficulty = 6  # renewals are cheap by design (mobile battery)
              inject = true         # add the renewal script to proxied HTML

              # Trap 1 in docs/docker.md, and it applies with full force to
              # Kubernetes: WebCrypto and service workers require a secure
              # context — HTTPS or localhost. Reaching a NodePort at
              # http://10.x.y.z walls every visitor permanently. Terminate TLS
              # at your Ingress (and then set trusted_proxies below), or flip
              # this to true for a LAN-only cluster and accept a 10-50x slower
              # fallback whose cost falls on the honest visitor.
              allow_insecure_context = false

              # Empty is correct when clients reach the Service directly from
              # inside the cluster: nothing in front sets X-Forwarded-For, and
              # trusting a header nobody sets lets any client claim any
              # address. Behind an ingress controller this MUST name the range
              # its traffic arrives from — usually the pod CIDR, e.g.
              #   trusted_proxies = ["10.244.0.0/16"]
              # or three things break quietly: the pass cookie loses its
              # Secure flag, the app sees the ingress's address instead of the
              # visitor's, and CIDR bypass matches the wrong thing.
              trusted_proxies = []

              # No [[hmac_keys]]: the key arrives as ANTEROOM_HMAC_KEY from
              # the cloned Secret, registering as kid = "env" on every
              # replica. Pick ONE mechanism fleet-wide — an env-keyed gate and
              # a file-keyed gate will not verify each other's passes even
              # with identical key bytes.

              [bypass]
              # Paths that skip the gate entirely, byte for byte and with no
              # pass. `/webhooks/*` is the row that costs real money: a POST
              # is not a browser navigation, so without it the gate refuses
              # the delivery and the body is gone. Kubelet probes need no row
              # here — the kubelet dials the app's containerPort directly,
              # inside the pod, and never crosses the gate.
              paths = ["/robots.txt", "/sitemap.xml", "/feed.xml", "/.well-known/*", "/webhooks/*"]
              cidrs = []

              [triage]
              json_accept    = true
              ok_body_agents = ["claude-user"]

    - name: clone-hmac-secret
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  anteroom.radiustech.xyz/inject: enabled
      generateExisting: true
      generate:
        apiVersion: v1
        kind: Secret
        name: anteroom
        namespace: "{{ request.object.metadata.name }}"
        # Rotation is an edit to the source Secret in anteroom-system; the
        # clones follow. Pods pick the new key up only on restart — env vars
        # are read once — so rotate with a rollout, and expect in-flight
        # passes signed by the old key to die: single-key rotation is a hard
        # cutover. Zero-downtime rotation needs [[hmac_keys]] in the config
        # file (first key signs, the rest still verify), which is file-keyed
        # and therefore a different fleet-wide mechanism — see the note above.
        synchronize: true
        clone:
          namespace: anteroom-system
          name: anteroom
